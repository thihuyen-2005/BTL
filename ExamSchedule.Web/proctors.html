<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giám thị</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="page-header">
            <div>
                <div class="title">Quản lý Giám thị</div>
                <div class="subtitle">Danh sách cán bộ và lịch coi thi</div>
            </div>
        </div>

        <div class="toolbar">
            <input id="search" placeholder="Tìm mã, họ tên, đơn vị">
            <select id="filterStatus">
                <option value="">Tất cả trạng thái</option>
                <option value="free">Đang rảnh</option>
                <option value="busy">Đã có lịch</option>
            </select>
            <div class="spacer"></div>
            <button class="btn btn-primary" id="btnAddProctor">＋ Thêm giám thị</button>
            <button class="btn btn-ghost" id="btnRefresh">↻ Làm mới</button>
            <button class="btn btn-del" id="btnDeleteSelected" type="button" disabled>🗑️ Xóa đã chọn</button>
        </div>

        <div class="toolbar" style="margin-top: 12px; margin-bottom: 16px;">
            <select id="examSelect">
                <option value="">Chọn kỳ thi</option>
            </select>
            <select id="sessionSelect">
                <option value="">Chọn ca thi</option>
            </select>
        </div>

        <section id="assignmentPanel" class="card hidden" style="margin-bottom:18px;">
            <div class="card-header">
                <h3 id="assignmentTitle">Phân công giám thị</h3>
                <button class="btn btn-accent" id="btnAutoAssign">⚡ Phân công tự động</button>
            </div>
            <div style="padding:14px;">
                <div id="assignmentInfo" style="color:#64748b; margin-bottom:12px;"></div>
                <div class="toolbar" style="margin-bottom:12px;">
                    <select id="proctorSelect"></select>
                    <select id="roleSelect">
                        <option value="Truong_ca">Trưởng ca</option>
                        <option value="Giam_thi_1">Giám thị 1</option>
                        <option value="Giam_thi_2">Giám thị 2</option>
                    </select>
                    <button class="btn btn-primary" id="btnAssign">Phân công</button>
                </div>
                <div id="assignmentList"></div>
            </div>
        </section>

        <div id="countInfo" style="color:#64748b; font-size:13px; margin-bottom:12px;"></div>
        <div class="card">
            <table id="tblProctors">
                <thead>
                    <tr>
                        <th class="checkbox-col"><input type="checkbox" id="selectAllRows" aria-label="Chọn tất cả"></th>
                        <th>Mã cán bộ</th>
                        <th>Họ tên</th>
                        <th>Đơn vị</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Trạng thái</th>
                        <th>Số ca</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="scheduleModal" class="modal hidden">
        <div class="modal-content modal-wide">
            <h2 id="scheduleTitle">Lịch coi thi</h2>
            <div id="scheduleBody"></div>
            <div class="actions"><button type="button" id="closeSchedule">Đóng</button></div>
        </div>
    </div>

    <div id="proctorModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="proctorModalTitle">Thêm giám thị</h2>
            <form id="proctorForm">
                <input type="hidden" id="proctorId">
                <label>Mã giám thị
                    <input id="proctorStaffCode" required maxlength="50" placeholder="VD: GT-001">
                </label>
                <label>Họ tên
                    <input id="proctorFullName" required maxlength="100" placeholder="VD: Nguyễn Văn A">
                </label>
                <label>Email
                    <input type="email" id="proctorEmail" maxlength="100" placeholder="VD: name@domain.com">
                </label>
                <label>Số điện thoại
                    <input id="proctorPhone" maxlength="20" placeholder="VD: 0903...">
                </label>
                <label>Đơn vị
                    <input id="proctorDepartment" maxlength="150" placeholder="VD: Phòng Khảo thí">
                </label>
                <label>Trạng thái
                    <select id="proctorIsActive">
                        <option value="true">Hoạt động</option>
                        <option value="false">Không hoạt động</option>
                    </select>
                </label>
                <div class="actions">
                    <button type="button" id="closeProctorModal">Hủy</button>
                    <button type="submit" id="saveProctorBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/proctors.js"></script>
</body>
</html>
