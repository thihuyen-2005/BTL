<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Ca thi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <div class="page-header">
            <div>
                <div class="title" id="kyThiTitle">Quản lý Ca thi</div>
                <div class="subtitle">Thiết lập các ca thi cho kỳ thi</div>
            </div>
        </div>

        <div class="toolbar">
            <input id="search" placeholder="🔍 Tìm ca thi, phòng, kỳ thi, ghi chú">
            <select id="filterStatus">
                <option value="">Tất cả trạng thái</option>
                <option value="Du_kien">Dự kiến</option>
                <option value="Cho_xep">Chờ xếp</option>
                <option value="Da_xep">Đã xếp</option>
                <option value="Dong">Đã đóng</option>
                <option value="Huy">Đã hủy</option>
            </select>
            <div class="spacer"></div>
            <button class="btn btn-primary" id="btnSchedule">⚙️ Xếp lịch tự động</button>
            <button class="btn btn-primary" id="btnAdd">➕ Thêm ca thi</button>
            <button class="btn btn-del" id="btnDeleteSelected" type="button" disabled>🗑️ Xóa đã chọn</button>
        </div>

        <div class="card">
            <table id="tblSessions">
                <thead>
                    <tr>
                        <th class="checkbox-col"><input type="checkbox" id="selectAllRows" aria-label="Chọn tất cả"></th>
                        <th style="width:60px;">ID</th>
                        <th>Phòng thi</th>
                        <th>Bắt đầu</th>
                        <th>Kết thúc</th>
                        <th style="width:90px;">Sức chứa</th>
                        <th>Trạng thái</th>
                        <th style="width:230px;">Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm ca thi</h2>
            <form id="formSession">
                <label>Phòng thi
                    <select id="phongThi" required>
                        <optgroup label="🏢 Tòa A1">
                            <option value="1">A1-101 (25 chỗ)</option>
                            <option value="2">A1-102 (25 chỗ)</option>
                            <option value="3">A1-103 (25 chỗ)</option>
                            <option value="4">A1-104 (25 chỗ)</option>
                            <option value="5">A1-105 (25 chỗ)</option>
                            <option value="6">A1-201 (25 chỗ)</option>
                            <option value="7">A1-202 (25 chỗ)</option>
                            <option value="8">A1-203 (25 chỗ)</option>
                            <option value="9">A1-204 (25 chỗ)</option>
                            <option value="10">A1-205 (25 chỗ)</option>
                            <option value="11">A1-301 (25 chỗ)</option>
                            <option value="12">A1-302 (25 chỗ)</option>
                            <option value="13">A1-303 (25 chỗ)</option>
                            <option value="14">A1-304 (25 chỗ)</option>
                            <option value="15">A1-305 (25 chỗ)</option>
                            <option value="16">A1-401 (25 chỗ)</option>
                            <option value="17">A1-402 (25 chỗ)</option>
                            <option value="18">A1-403 (25 chỗ)</option>
                            <option value="19">A1-404 (25 chỗ)</option>
                            <option value="20">A1-405 (25 chỗ)</option>
                        </optgroup>

                        <optgroup label="🏢 Tòa A2">
                            <option value="21">A2-106 (25 chỗ)</option>
                            <option value="22">A2-107 (25 chỗ)</option>
                            <option value="23">A2-108 (25 chỗ)</option>
                            <option value="24">A2-109 (25 chỗ)</option>
                            <option value="25">A2-110 (25 chỗ)</option>
                            <option value="26">A2-111 (25 chỗ)</option>
                            <option value="27">A2-206 (25 chỗ)</option>
                            <option value="28">A2-207 (25 chỗ)</option>
                            <option value="29">A2-208 (25 chỗ)</option>
                            <option value="30">A2-209 (25 chỗ)</option>
                            <option value="31">A2-210 (25 chỗ)</option>
                            <option value="32">A2-211 (25 chỗ)</option>
                            <option value="33">A2-306 (25 chỗ)</option>
                            <option value="34">A2-307 (25 chỗ)</option>
                            <option value="35">A2-308 (25 chỗ)</option>
                            <option value="36">A2-309 (25 chỗ)</option>
                            <option value="37">A2-310 (25 chỗ)</option>
                            <option value="38">A2-311 (25 chỗ)</option>
                            <option value="39">A2-406 (25 chỗ)</option>
                            <option value="40">A2-407 (25 chỗ)</option>
                            <option value="41">A2-408 (25 chỗ)</option>
                            <option value="42">A2-409 (25 chỗ)</option>
                            <option value="43">A2-410 (25 chỗ)</option>
                            <option value="44">A2-411 (25 chỗ)</option>
                        </optgroup>

                        <optgroup label="💻 Tòa A3 (Phòng máy)">
                            <option value="45">A3-101 (25 chỗ)</option>
                            <option value="46">A3-102 (25 chỗ)</option>
                            <option value="47">A3-103 (25 chỗ)</option>
                            <option value="48">A3-104 (25 chỗ)</option>
                            <option value="49">A3-105 (25 chỗ)</option>
                            <option value="50">A3-201 (25 chỗ)</option>
                            <option value="51">A3-202 (25 chỗ)</option>
                            <option value="52">A3-203 (25 chỗ)</option>
                            <option value="53">A3-204 (25 chỗ)</option>
                            <option value="54">A3-205 (25 chỗ)</option>
                            <option value="55">A3-301 (25 chỗ)</option>
                            <option value="56">A3-302 (25 chỗ)</option>
                            <option value="57">A3-303 (25 chỗ)</option>
                            <option value="58">A3-304 (25 chỗ)</option>
                            <option value="59">A3-305 (25 chỗ)</option>
                        </optgroup>
                    </select>
                </label>
                <label>Thời gian bắt đầu
                    <input type="datetime-local" id="batDau" required>
                </label>
                <label>Thời lượng
                    <input value="120 phút - thi trên máy" readonly>
                </label>
                <label>Sức chứa
                    <input type="number" id="sucChua" min="1" value="30" required>
                </label>
                <label>Ghi chú
                    <textarea id="ghiChu" rows="2"></textarea>
                </label>
                <div class="actions">
                    <button type="button" id="btnCancel">Hủy</button>
                    <button type="submit">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/exam-sessions.js"></script>
</body>
</html>
