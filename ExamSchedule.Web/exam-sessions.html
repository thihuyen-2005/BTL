<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Ca thi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <div class="page-header">
            <div>
                <div class="title" id="kyThiTitle">Quản lý Ca thi</div>
                <div class="subtitle">Thiết lập các ca thi cho kỳ thi</div>
            </div>
        </div>

        <div class="toolbar">
            <select id="filterStatus">
                <option value="">Tất cả trạng thái</option>
                <option>Du_kien</option>
                <option>Cho_xep</option>
                <option>Da_xep</option>
                <option>Dong</option>
                <option>Huy</option>
            </select>
            <div class="spacer"></div>
            <button class="btn btn-primary" id="btnAdd">➕ Thêm ca thi</button>
        </div>

        <div class="card">
            <table id="tblSessions">
                <thead>
                    <tr>
                        <th style="width:60px;">ID</th>
                        <th>Phòng thi</th>
                        <th>Bắt đầu</th>
                        <th>Kết thúc</th>
                        <th style="width:90px;">Sức chứa</th>
                        <th>Trạng thái</th>
                        <th style="width:100px;">Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2>Thêm ca thi</h2>
            <form id="formSession">
                <label>Phòng thi
                    <select id="phongThi" required>
                        <option value="1">A101 - Sức chứa 30</option>
                        <option value="2">A102 - Sức chứa 40</option>
                        <option value="3">B201 - Sức chứa 50</option>
                    </select>
                </label>
                <label>Thời gian bắt đầu
                    <input type="datetime-local" id="batDau" required>
                </label>
                <label>Thời gian kết thúc
                    <input type="datetime-local" id="ketThuc" required>
                </label>
                <label>Sức chứa
                    <input type="number" id="sucChua" min="1" value="30" required>
                </label>
                <label>Ghi chú
                    <textarea id="ghiChu" rows="2"></textarea>
                </label>
                <div class="actions">
                    <button type="button" id="btnCancel">Hủy</button>
                    <button type="submit">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/exam-sessions.js"></script>
</body>
</html>
