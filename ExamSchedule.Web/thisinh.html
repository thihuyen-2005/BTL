<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thí sinh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="page-header">
            <div>
                <div class="title">Danh sách Thí sinh</div>
                <div class="subtitle">Quản lý hồ sơ và tình trạng lệ phí của thí sinh</div>
            </div>
        </div>
        <div class="toolbar">
            <input id="search" placeholder="🔍 Mã hoặc họ tên">
            <input id="filterLop" placeholder="Lọc theo lớp">
            <select id="filterKhoa">
                <option value="">Tất cả khoa</option>
            </select>
            <select id="filterNganh">
                <option value="">Tất cả ngành</option>
            </select>
            <select id="filterPaid">
                <option value="">Tất cả trạng thái nộp</option>
                <option value="paid">Đã nộp 800.000</option>
                <option value="unpaid">Chưa nộp</option>
            </select>
            <div class="spacer"></div>
            <button class="btn btn-ghost" id="btnRefreshFilters">↻ Làm mới</button>
            <button class="btn btn-primary" id="btnManual">➕ Thêm thí sinh</button>
            <button class="btn btn-primary" id="btnImport">📊 Nhập file Excel</button>
            <button class="btn btn-del" id="btnDeleteSelected" type="button" disabled>🗑️ Xóa đã chọn</button>
        </div>
        <div class="table-scroll">
            <div class="card">
                <table id="tblCandidates">
                    <thead><tr><th class="checkbox-col"><input type="checkbox" id="selectAllRows" aria-label="Chọn tất cả"></th><th>Mã thí sinh</th><th>Họ và tên</th><th>Ngày sinh</th><th>Lớp</th><th>Ngành học</th><th>Số tiền</th><th>Email</th><th>Thao tác</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="manualModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="manualTitle">Thêm thí sinh</h2>
            <form id="candidateForm">
                <input id="candidateId" type="hidden">
                <div id="manualValidationMessage" class="validation-message hidden"></div>

                <label class="field-label">Mã thí sinh <span class="optional-tag">(tùy chọn)</span><input id="maThiSinh" placeholder="TS001"></label>
                <label class="field-label required">Họ và tên<input id="hoTen"></label>
                <label class="field-label required">Ngày sinh <span class="hint">dd/mm/yyyy</span><input id="ngaySinh" type="date"></label>
                <label class="field-label required">Giới tính<input id="gioiTinh"></label>
                <label class="field-label required">Số CCCD/Hộ chiếu<input id="soCccdHoChieu"></label>
                <label class="field-label required">Số điện thoại<input id="soDienThoai"></label>
                <label class="field-label required">Lớp<input id="lop"></label>
                <label class="field-label required">Khoa
                    <select id="khoa">
                        <option value="">-- Chọn khoa --</option>
                    </select>
                </label>
                <label class="field-label required">Ngành học
                    <select id="nganhHoc">
                        <option value="">-- Chọn ngành --</option>
                    </select>
                </label>
                <label class="field-label required">Tình trạng học phí
                    <select id="soTien">
                        <option value="">-- Chọn tình trạng học phí --</option>
                        <option value="800">Đã nộp 800.000 đồng</option>
                        <option value="0">Chưa nộp</option>
                    </select>
                </label>
                <label class="field-label">Email cá nhân <span class="optional-tag">(tùy chọn)</span><input id="emailCaNhan" type="email"></label>
                <div class="actions">
                    <button type="button" id="btnCancelManual">Hủy</button>
                    <button type="submit">Lưu thí sinh</button>
                </div>
            </form>
        </div>
    </div>
    <div id="importModal" class="modal hidden">
        <div class="modal-content">
            <h2>Nhập danh sách từ Excel</h2>
            <p>Chọn file .xlsx có dòng tiêu đề. Ô “Số tiền” ghi 800.000 sẽ được phép xếp ca; “Chưa nộp” sẽ không được xếp.</p>
            <input id="excelFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
            <div class="actions">
                <button type="button" id="btnCancelImport">Hủy</button>
                <button type="button" id="btnSaveImport">Nhập và lưu</button>
            </div>
        </div>
    </div>
    <script src="js/api.js?v=20260924-2"></script>
    <script src="js/layout.js?v=20260924-2"></script>
    <script src="js/thisinh.js?v=20260924-2"></script>
</body>
</html>
